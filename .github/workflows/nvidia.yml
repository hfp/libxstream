name: NVIDIA

permissions:
  contents: read
  # the previous run's counts (artifact)
  actions: read

# OpenCL on simulated NVIDIA GPUs (https://github.com/pantheongpu/pantheonsim):
# PoCL's CUDA driver compiles OpenCL C to PTX with LLVM and runs it through the
# CUDA driver API, which the simulator implements, hence every kernel runs as
# PTX of the card's architecture without a GPU. Correctness, the counts of
# the named mixes (scripts/tool_collect.sh), and the Ozaki sample through every
# kernel level with what ran asserted (tests/ozaki.sh); the simulator has no
# timing.
# Weekly, like the AMD workflow. PoCL is the cached build all PoCL jobs share
# (.github/actions/pocl).
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      gpus:
        description: "Simulated GPUs (vgpu list-gpus), H100 PCIe and GH200 if empty"
        default: ""
      env:
        description: "Environment for all steps, e.g., LIBXSTREAM_VERBOSE=2"
        default: ""

jobs:
  OpenCL:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GPUS: ${{ github.event.inputs.gpus || 'nvidia/h100-pcie nvidia/gh200-480gb' }}
      # a host fallback must not pass for a device run, nor a fallback after a failure
      LIBXSTREAM_DEVTYPE: gpu
      LIBXSTREAM_FALLBACK: 0
      OMP_NUM_THREADS: 2
      CHECK: 1
    steps:
    - uses: actions/checkout@v7

    # Space-separated NAME=VALUE pairs given when launching manually. They come
    # in through the environment rather than the script, so no value is executed.
    - name: Setup environment
      if: github.event.inputs.env != ''
      env:
        INPUT_ENV: ${{ github.event.inputs.env }}
      run: |
        for NAME_VALUE in ${INPUT_ENV}; do
          if ! echo "${NAME_VALUE}" | grep -qE '^[A-Za-z_][A-Za-z0-9_]*=[^[:space:]]*$'; then
            echo "ERROR: \"${NAME_VALUE}\" is not NAME=VALUE"; exit 1
          fi
          echo "${NAME_VALUE}" >> $GITHUB_ENV
          echo "${NAME_VALUE}"
        done

    # A release's prebuilt simulator with its CUDA driver API, by URL and
    # checksum. Its libraries come first on the library path: they are the
    # libcuda that PoCL's CUDA driver loads.
    - name: Setup simulator
      env:
        VERSION: 0.2.1
        TARBALL: pantheonsim-0.2.1-linux-x86_64-ubuntu24.04-cuda12.6-0a807b1c3a7eade24928.tar.gz
        SHA256: 73f68d364d345cbe12110e0578ee4f1ab600c8777b0ed4aaccc0d9e9c226865d
      run: |
        DIR=${RUNNER_TEMP}/pantheonsim
        mkdir -p "${DIR}"
        curl -fsSL --retry 5 --retry-all-errors -o "${RUNNER_TEMP}/${TARBALL}" \
          "https://github.com/pantheongpu/pantheonsim/releases/download/v${VERSION}/${TARBALL}"
        echo "${SHA256}  ${RUNNER_TEMP}/${TARBALL}" | sha256sum -c -
        tar -xzf "${RUNNER_TEMP}/${TARBALL}" -C "${DIR}"
        { echo "${DIR}/bin"; echo "${DIR}"; } >> "${GITHUB_PATH}"
        { echo "VGPU_SHIM_DIR=${DIR}/shim"
          echo "LD_LIBRARY_PATH=${DIR}/shim${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
        } >> "${GITHUB_ENV}"

    - uses: ./.github/actions/pocl
      with:
        devices: cuda

    # PoCL targets sm_75 at most unless told the GPU's architecture, which the
    # simulator reports; the first GPU is the one of the steps below.
    - name: Devices
      run: |
        for GPU in ${GPUS}; do
          SM=$(vgpu info --gpu "${GPU}" | sed -n 's/.*compute capability:[[:space:]]*\([0-9]*\)\.\([0-9]*\).*/sm_\1\2/p')
          if [ -z "${SM}" ]; then echo "ERROR: ${GPU} is not a simulated NVIDIA GPU"; exit 1; fi
          echo "::group::${GPU} (${SM})"
          VGPU_GPU=${GPU} POCL_CUDA_GPU_ARCH=${SM} clinfo --raw | grep -E 'CL_PLATFORM_VERSION|CL_DEVICE_(NAME|VERSION|EXTENSIONS)[[:space:]]'
          echo "::endgroup::"
          if [ -z "${FIRST}" ]; then
            FIRST=${GPU}
            { echo "VGPU_GPU=${GPU}"; echo "POCL_CUDA_GPU_ARCH=${SM}"; } >> "${GITHUB_ENV}"
          fi
        done

    # the host reference GEMM of the Ozaki sample (BLAS=2)
    - name: Install OpenBLAS
      run: sudo apt install -y libopenblas-openmp-dev

    - name: Setup LIBXS
      run: |
        git clone --depth 1 https://github.com/hfp/libxs.git ${{ github.workspace }}/../libxs
        echo "LIBXSROOT=${{ github.workspace }}/../libxs" >> $GITHUB_ENV

    - name: Build LIBXS
      run: cd ${LIBXSROOT} && make -j $(nproc)

    - name: Build LIBXSTREAM
      run: make -j $(nproc)

    - name: Test
      run: make -j $(nproc) test

    # The named mixes on every GPU, counted per launch (scripts/tool_score.py
    # reads counts.tsv); a failing case fails the step after all are counted.
    - name: Counts
      run: |
        BIN=${RUNNER_TEMP}/bin
        OUT=${RUNNER_TEMP}/counts
        mkdir -p "${BIN}"
        for ELEM in double float; do
          make -j $(nproc) -C samples/mixes ELEM_TYPE=${ELEM}
          cp samples/mixes/mixes.x "${BIN}/mixes_${ELEM}.x"
        done
        STATUS=0
        for GPU in ${GPUS}; do
          SM=$(vgpu info --gpu "${GPU}" | sed -n 's/.*compute capability:[[:space:]]*\([0-9]*\)\.\([0-9]*\).*/sm_\1\2/p')
          VGPU_GPU=${GPU} POCL_CUDA_GPU_ARCH=${SM} BIN=${BIN} CASES="mixes_double mixes_float" \
            scripts/tool_collect.sh count "${OUT}" || STATUS=1
        done
        cat "${OUT}/status.txt"
        exit ${STATUS}

    - name: Upload counts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: nvidia-counts
        path: ${{ runner.temp }}/counts
        if-no-files-found: ignore

    # The counts of the last passing run, to tell what this run changed. A
    # first run, or one whose predecessor's artifact expired, has none.
    - name: Previous counts
      if: ${{ !cancelled() }}
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        RUN=$(gh run list -R "${GITHUB_REPOSITORY}" --workflow nvidia.yml --branch "${GITHUB_REF_NAME}" \
          --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
        if [ -n "${RUN}" ] && gh run download "${RUN}" -R "${GITHUB_REPOSITORY}" -n ozaki-logs -D "${RUNNER_TEMP}/previous"; then
          echo "PREV=${RUNNER_TEMP}/previous/counts.tsv" >> "${GITHUB_ENV}"
          echo "previous passing run: ${RUN}"
        fi

    # The Ozaki sample on every GPU through each kernel level, warp-group MMA
    # included, asserting the path that ran (tests/ozaki.sh says how). The
    # summary is written before the step fails, hence a failure shows all.
    - name: Ozaki
      if: ${{ !cancelled() }}
      shell: bash
      env:
        LOGS: ${{ runner.temp }}/ozaki
        META: "PoCL 7.2 with LLVM ${{ env.POCL_LLVM }}, PantheonSim 0.2.1"
      run: |
        STATUS=0
        tests/ozaki.sh || STATUS=$?
        if [ -s "${LOGS}/summary.md" ]; then cat "${LOGS}/summary.md" >> "${GITHUB_STEP_SUMMARY}"; fi
        exit ${STATUS}

    # Every run's full output, also of the runs that passed (for comparison).
    - name: Upload Ozaki logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ozaki-logs
        path: ${{ runner.temp }}/ozaki
        if-no-files-found: ignore
