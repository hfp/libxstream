name: GCC

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  Test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flags: [DBG=0, DBG=1 PEDANTIC=2]
        libxs: [prebuilt]
        include:
          # Sanitizers on one combination rather than a job of its own. They
          # ride the optimized one because -O0 hides what the optimizer does
          # with undefined behaviour. SANITIZE implies SYM=1, so the reports
          # carry file and line without DBG=1.
          - flags: DBG=0
            libxs: prebuilt
            sanitize: address,undefined
          - flags: DBG=1 PEDANTIC=2 FORCE_CXX=1 FORTRAN=0
            libxs: header-only
    env:
      # picked up by Makefile.inc through "SANITIZE ?=", hence no step below
      # needs to know about it; empty for every other combination
      SANITIZE: ${{ matrix.sanitize }}
      # a finding prints and continues by default, which would keep the job
      # green; stop at the first one so it is the job that reports it
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      # LeakSanitizer rides along with AddressSanitizer and is off for now: the
      # OpenCL loader the tests link holds allocations to exit, and a registry
      # that outlives main is a design choice rather than a leak. Turn it on
      # (detect_leaks=1) to see what a run actually reports.
      # The fake stack behind use-after-return detection does not honor the 64-byte
      # alignment GCC gives locals that 512-bit code loads, so an AVX-512 path
      # faults on an aligned access (reported as SEGV without an address).
      ASAN_OPTIONS: detect_leaks=0:detect_stack_use_after_return=0
    steps:
    - uses: actions/checkout@v5

    - name: Install OpenBLAS
      run: sudo apt install -y libopenblas-openmp-dev

    - name: Install OpenCL
      run: sudo apt install -y opencl-c-headers ocl-icd-libopencl1 ocl-icd-opencl-dev

    # tests/kernels.c compiles the OpenCL kernels, which a runner otherwise never
    # does: it has no GPU and no platform, so the kernel sources go unchecked.
    - name: Install Clang
      run: sudo apt install -y clang

    - name: Setup LIBXS
      run: |
        git clone --depth 1 https://github.com/hfp/libxs.git ${{ github.workspace }}/../libxs
        echo "LIBXSROOT=${{ github.workspace }}/../libxs" >> $GITHUB_ENV

    - name: Build LIBXS
      if: matrix.libxs == 'prebuilt'
      run: cd ${LIBXSROOT} && make -j $(nproc) ${{ matrix.flags }} FORTRAN=0

    - name: Install LIBXS
      if: matrix.libxs == 'prebuilt' && matrix.sanitize == ''
      run: cd ${LIBXSROOT} && make -j $(nproc) ${{ matrix.flags }} FORTRAN=0 install PREFIX=$HOME/libxs-install

    - name: Build LIBXSTREAM
      if: matrix.libxs != 'header-only'
      run: make -j $(nproc) ${{ matrix.flags }}

    - name: Test
      run: make -j $(nproc) ${{ matrix.flags }} test

    # The stencil sample can translate its OpenCL kernel with the C compiler
    # (OCL=0), which is the only path here that runs kernel code: a runner has
    # no GPU. The flags are the matrix ones as environment, which Makefile.inc
    # picks up the same way it picks up SANITIZE.
    - name: Test stencil (host kernel)
      run: env ${{ matrix.flags }} tests/stencil.sh

    - name: Install (PREFIX)
      if: matrix.libxs != 'header-only'
      run: make -j $(nproc) ${{ matrix.flags }} HEADER_ONLY=1 install PREFIX=$HOME/libxstream-install

    - name: Verify install (PREFIX)
      if: matrix.libxs != 'header-only'
      run: |
        test -f $HOME/libxstream-install/include/libxstream/libxstream.h
        test -f $HOME/libxstream-install/include/libxstream/libxstream_version.h
        test -f $HOME/libxstream-install/include/libxstream/libxstream_source.h
        test -d $HOME/libxstream-install/include/libxstream/src
        ls $HOME/libxstream-install/lib/libxstream.* >/dev/null
        test -f $HOME/libxstream-install/lib/cmake/libxstream/libxstreamConfig.cmake
        test -f $HOME/libxstream-install/share/libxstream/scripts/tool_opencl.sh

    - name: Verify GNU Make install with CMake consumer
      if: matrix.libxs != 'header-only' && matrix.sanitize == ''
      run: |
        mkdir -p /tmp/test_find
        cat > /tmp/test_find/CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.13)
        project(test_find C)
        find_package(libxstream CONFIG REQUIRED)
        add_executable(test_find test_find.c)
        target_link_libraries(test_find libxstream::libxstream)
        EOF
        cat > /tmp/test_find/test_find.c <<'EOF'
        #include <libxstream/libxstream.h>
        int main(void) { return libxstream_init() || libxstream_finalize(); }
        EOF
        cmake -B /tmp/test_find/build -S /tmp/test_find \
          -DCMAKE_PREFIX_PATH="$HOME/libxstream-install;$HOME/libxs-install"
        cmake --build /tmp/test_find/build
        LD_LIBRARY_PATH=$HOME/libxstream-install/lib:$HOME/libxs-install/lib \
          /tmp/test_find/build/test_find

    - name: Verify GNU Make install with GNU Make consumer
      if: matrix.libxs != 'header-only' && matrix.sanitize == ''
      run: |
        mkdir -p /tmp/test_make
        cat > /tmp/test_make/Makefile <<'EOF'
        CC ?= cc
        .RECIPEPREFIX := >
        CPPFLAGS += $(shell pkg-config --cflags libxstream)
        LDLIBS += $(shell pkg-config --static --libs libxstream)
        test_make: test_make.c
        >$(CC) $(CPPFLAGS) $(CFLAGS) -o $@ $< $(LDFLAGS) $(LDLIBS)
        EOF
        cat > /tmp/test_make/test_make.c <<'EOF'
        #include <libxstream.h>
        int main(void) { return libxstream_init() || libxstream_finalize(); }
        EOF
        PKG_CONFIG_PATH=$HOME/libxstream-install/lib/pkgconfig:$HOME/libxs-install/lib/pkgconfig \
          make -C /tmp/test_make
        LD_LIBRARY_PATH=$HOME/libxstream-install/lib:$HOME/libxs-install/lib \
          /tmp/test_make/test_make

    - name: Out-of-tree build and test
      run: |
        mkdir $HOME/libxstream-oot && cd $HOME/libxstream-oot
        make -j $(nproc) -f ${{ github.workspace }}/Makefile ${{ matrix.flags }} test

    - name: Build samples
      if: matrix.libxs == 'header-only'
      run: make -j $(nproc) ${{ matrix.flags }} PARAMS= samples

  # OpenCL-MPS end to end: the samples run once directly and once forwarded to
  # the server, which PoCL's CPU device serves. A run that falls back to direct
  # OpenCL passes the checks as well, hence the log has to show the connection.
  MPS:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIBXSTREAM_DEVTYPE: cpu
      OMP_NUM_THREADS: 2
      # acc_bench fails on a wrong result only if CHECK is positive
      CHECK: 1
    steps:
    - uses: actions/checkout@v5

    - name: Install OpenBLAS and OpenCL
      run: |
        sudo apt update -y
        sudo apt install -y libopenblas-openmp-dev \
          opencl-c-headers ocl-icd-libopencl1 ocl-icd-opencl-dev pocl-opencl-icd

    - name: Setup LIBXS
      run: |
        git clone --depth 1 https://github.com/hfp/libxs.git ${{ github.workspace }}/../libxs
        echo "LIBXSROOT=${{ github.workspace }}/../libxs" >> $GITHUB_ENV

    # Shared libraries: the OpenCL loader loads the forwarding ICD, which loads
    # libxstream.so, and the server is the executable beside it.
    - name: Build LIBXS
      run: cd ${LIBXSROOT} && make -j $(nproc) STATIC=0 FORTRAN=0

    - name: Build LIBXSTREAM
      run: |
        make -j $(nproc) STATIC=0
        test -x lib/libxstream_mpsd && test -f lib/libxstream_icd.so
        echo "LD_LIBRARY_PATH=${{ github.workspace }}/lib:${LIBXSROOT}/lib" >> $GITHUB_ENV

    - name: Test SMM sample
      shell: bash # pipefail, or tee hides a failure
      run: |
        make -j $(nproc) STATIC=0 -C samples/smm
        cd samples/smm
        ./acc_bench.x 3 3000 13x5x7
        LIBXSTREAM_MPS=1 LIBXSTREAM_VERBOSE=1 ./acc_bench.x 3 3000 13x5x7 2>&1 | tee mps.log
        grep -q "LIBXSTREAM-MPS: connected" mps.log || { echo "ERROR: the run did not use OpenCL-MPS"; exit 1; }

    - name: Test DBM sample
      shell: bash
      run: |
        make -j $(nproc) STATIC=0 -C samples/dbm test TESTARG="3 3000 13x5x7"
        LIBXSTREAM_MPS=1 make STATIC=0 -C samples/dbm test TESTARG="3 3000 13x5x7" 2>&1 | tee mps.log
        grep -q "LIBXSTREAM-MPS: connected" mps.log || { echo "ERROR: the run did not use OpenCL-MPS"; exit 1; }

  Debian:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt update -y
        sudo apt install -y build-essential debhelper devscripts fakeroot \
          gfortran opencl-c-headers ocl-icd-opencl-dev

    - name: Build and install LIBXS
      run: |
        git clone --depth 1 https://github.com/hfp/libxs.git ${{ github.workspace }}/../libxs
        cd ${{ github.workspace }}/../libxs
        make -j $(nproc) GNU=1 STATIC=0
        sudo make install PREFIX=/usr STATIC=0 \
          POUTDIR=lib/x86_64-linux-gnu \
          PPKGDIR=lib/x86_64-linux-gnu/pkgconfig \
          PCMKDIR=lib/x86_64-linux-gnu/cmake/libxs
        sudo ldconfig

    - name: Build Debian package
      run: |
        cp -a scripts/debian .
        chmod +x debian/rules
        dpkg-buildpackage -us -uc -d -b

    - name: Verify Debian packages
      run: |
        dpkg-deb -c ../libxstream0_*.deb
        dpkg-deb -c ../libxstream-dev_*.deb

    - name: Collect packages
      run: cp ../*.deb .

    - name: Upload packages
      uses: actions/upload-artifact@v5
      with:
        name: libxstream-deb
        path: "*.deb"

  RPM:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        dnf install -y rpm-build gcc gcc-gfortran cmake ninja-build bash git \
          ocl-icd-devel opencl-headers

    - name: Install LIBXS
      run: |
        git clone --depth 1 https://github.com/hfp/libxs.git ../libxs
        cd ../libxs && mkdir build && cd build
        cmake .. -GNinja && ninja install -j $(nproc)
        ldconfig

    - name: Build RPM package
      run: |
        mkdir -p $HOME/rpmbuild/{SOURCES,SPECS}
        cp scripts/fedora/libxstream.spec $HOME/rpmbuild/SPECS/
        VERSION=$(grep '^Version:' scripts/fedora/libxstream.spec | awk '{print $2}')
        tar czf $HOME/rpmbuild/SOURCES/libxstream-${VERSION}.tar.gz \
          --transform="s,^\.,libxstream-${VERSION}," .
        rpmbuild -bb --nodeps --nocheck \
          $HOME/rpmbuild/SPECS/libxstream.spec

    - name: Upload packages
      uses: actions/upload-artifact@v5
      with:
        name: libxstream-rpm
        path: ~/rpmbuild/RPMS/

  CMake:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gcc: [12, 14]
        shared: [static, shared]
    env:
      CC: gcc-${{ matrix.gcc }}
      CXX: g++-${{ matrix.gcc }}
    steps:
    - uses: actions/checkout@v5

    - name: Install GCC ${{ matrix.gcc }} and Ninja
      run: sudo apt install -y gcc-${{ matrix.gcc }} g++-${{ matrix.gcc }} ninja-build

    - name: Install OpenBLAS
      run: sudo apt install -y libopenblas-openmp-dev

    - name: Install OpenCL
      run: sudo apt install -y opencl-c-headers ocl-icd-libopencl1 ocl-icd-opencl-dev

    # tests/kernels.c compiles the OpenCL kernels, which a runner otherwise never
    # does: it has no GPU and no platform, so the kernel sources go unchecked.
    - name: Install Clang
      run: sudo apt install -y clang

    - name: Build LIBXS
      run: |
        git clone --depth 1 https://github.com/hfp/libxs.git ${{ github.workspace }}/../libxs
        cd ${{ github.workspace }}/../libxs
        cmake -B build -G Ninja -DCMAKE_INSTALL_PREFIX=$HOME/libxs-install -DLIBXS_FORTRAN=OFF
        cmake --build build --target install -j $(nproc)

    - name: Configure LIBXSTREAM
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_PREFIX_PATH=$HOME/libxs-install \
          -DCMAKE_INSTALL_PREFIX=$HOME/libxstream-install \
          -DLIBXSTREAM_INSTALL_HEADER_ONLY=ON \
          -DLIBXSTREAM_OMP=ON \
          -DBUILD_TESTING=ON \
          -DBUILD_SHARED_LIBS=${{ matrix.shared == 'shared' && 'ON' || 'OFF' }}

    - name: Build
      run: cmake --build build --verbose -j $(nproc)

    - name: Test
      run: ctest --test-dir build --output-on-failure -j $(nproc)

    - name: Install
      run: cmake --install build

    - name: Verify install
      run: |
        test -f $HOME/libxstream-install/include/libxstream/libxstream.h
        test -f $HOME/libxstream-install/include/libxstream/libxstream_source.h
        test -d $HOME/libxstream-install/include/libxstream/src
        ls $HOME/libxstream-install/lib/libxstream* >/dev/null
        ls $HOME/libxstream-install/lib/pkgconfig/libxstream.pc >/dev/null
        test -f $HOME/libxstream-install/lib/cmake/libxstream/libxstream-config.cmake
        test -f $HOME/libxstream-install/lib/cmake/libxstream/libxstream-targets.cmake
        test -f $HOME/libxstream-install/share/libxstream/scripts/tool_opencl.sh
        test -f $HOME/libxstream-install/share/libxstream/samples/smm/smm_acc.c
        test -f $HOME/libxstream-install/share/libxstream/samples/smm/kernels/multiply.cl
        test -f $HOME/libxstream-install/share/libxstream/samples/dbm/dbm_opencl.c
        test -f $HOME/libxstream-install/share/libxstream/samples/dbm/kernels/multiply.cl

    - name: Verify find_package
      run: |
        mkdir -p /tmp/test_find
        cat > /tmp/test_find/CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.13)
        project(test_find C)
        find_package(libxstream CONFIG REQUIRED)
        add_executable(test_find test_find.c)
        target_link_libraries(test_find libxstream::libxstream)
        EOF
        cat > /tmp/test_find/test_find.c <<'EOF'
        #include <libxstream/libxstream.h>
        int main(void) { return libxstream_init() || libxstream_finalize(); }
        EOF
        cmake -B /tmp/test_find/build -S /tmp/test_find \
          -DCMAKE_PREFIX_PATH="$HOME/libxstream-install;$HOME/libxs-install"
        cmake --build /tmp/test_find/build
        LD_LIBRARY_PATH=$HOME/libxstream-install/lib:$HOME/libxs-install/lib \
          /tmp/test_find/build/test_find

    - name: Verify CMake install with GNU Make consumer
      run: |
        mkdir -p /tmp/test_make
        cat > /tmp/test_make/Makefile <<'EOF'
        CC ?= cc
        .RECIPEPREFIX := >
        CPPFLAGS += $(shell pkg-config --cflags libxstream)
        LDLIBS += $(shell pkg-config --static --libs libxstream)
        test_make: test_make.c
        >$(CC) $(CPPFLAGS) $(CFLAGS) -o $@ $< $(LDFLAGS) $(LDLIBS)
        EOF
        cat > /tmp/test_make/test_make.c <<'EOF'
        #include <libxstream/libxstream.h>
        int main(void) { return libxstream_init() || libxstream_finalize(); }
        EOF
        PKG_CONFIG_PATH=$HOME/libxstream-install/lib/pkgconfig:$HOME/libxs-install/lib/pkgconfig \
          make -C /tmp/test_make
        LD_LIBRARY_PATH=$HOME/libxstream-install/lib:$HOME/libxs-install/lib \
          /tmp/test_make/test_make

  Dispatch:
    needs: Test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
    - name: Trigger LIBXS tests
      run: |
        gh api repos/hfp/libxs/dispatches \
          -f event_type=libxstream-update \
          -f "client_payload[sha]=${{ github.sha }}"
      env:
        GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
