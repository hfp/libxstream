name: AMD

permissions:
  contents: read

# OpenCL on simulated AMD GPUs (https://github.com/pantheongpu/pantheonsim):
# ROCm's own OpenCL runtime, compiler included, runs on the simulator's HSA
# runtime, so every kernel is built for the card's real target and executed
# without a GPU. Correctness only: the simulator has no timing. Weekly, since
# neither the simulator nor ROCm moves with this repository.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      gpus:
        description: "Simulated GPUs of the atomics table (vgpu list-gpus)"
        default: "amd/mi250x amd/mi300x amd/mi350x amd/rx6900xt amd/rx7900xtx amd/rx9070xt"
      owner_dbcsr:
        description: "Owner of the DBCSR repository (hfp until upstreamed)"
        default: "hfp"
      ref_dbcsr:
        description: "DBCSR branch or tag"
        default: "develop"
      env:
        description: "Environment for all steps, e.g., LIBXSTREAM_VERBOSE=2"
        default: ""

jobs:
  OpenCL:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      # the scheduled run has no inputs, hence the defaults of the inputs again
      GPUS: ${{ github.event.inputs.gpus || 'amd/mi250x amd/mi300x amd/mi350x amd/rx6900xt amd/rx7900xtx amd/rx9070xt' }}
      OWNER_DBCSR: ${{ github.event.inputs.owner_dbcsr || 'hfp' }}
      REF_DBCSR: ${{ github.event.inputs.ref_dbcsr || 'develop' }}
      # a host fallback must not pass for a device run, nor a fallback after a failure
      LIBXSTREAM_DEVTYPE: gpu
      LIBXSTREAM_FALLBACK: 0
      OMP_NUM_THREADS: 2
      # acc_bench fails on a wrong result or a missing kernel only if CHECK is positive
      CHECK: 1
    steps:
    - uses: actions/checkout@v5

    # Space-separated NAME=VALUE pairs given when launching manually. They come
    # in through the environment rather than the script, so no value is executed.
    - name: Setup environment
      if: github.event.inputs.env != ''
      env:
        INPUT_ENV: ${{ github.event.inputs.env }}
      run: |
        for NAME_VALUE in ${INPUT_ENV}; do
          if ! echo "${NAME_VALUE}" | grep -qE '^[A-Za-z_][A-Za-z0-9_]*=[^[:space:]]*$'; then
            echo "ERROR: \"${NAME_VALUE}\" is not NAME=VALUE"; exit 1
          fi
          echo "${NAME_VALUE}" >> $GITHUB_ENV
          echo "${NAME_VALUE}"
        done

    # Two devices of the default GPU; a step selects another one by VGPU_GPU.
    # No hipcc (rocm: none): the OpenCL runtime below brings its own compiler.
    - name: Setup simulator
      uses: pantheongpu/setup-pantheonsim@ca87fe3143b29166822b923d6050945c5179408c # v0.1.5
      with:
        gpu: amd/mi250x
        count: 2
        rocm: none

    - name: Install OpenBLAS, GNU Fortran, OpenCL, and clinfo
      run: |
        sudo apt update -y
        sudo apt install -y libopenblas-openmp-dev gfortran \
          opencl-c-headers ocl-icd-libopencl1 ocl-icd-opencl-dev clinfo \
          libelf1t64 libnuma1 libtinfo6 libzstd1 zlib1g

    # Unpacked rather than installed: the packages depend on the kernel driver
    # and on ROCm's HSA runtime, which is the simulator's here. The ICD loader
    # finds only this vendor, hence no CPU device can stand in for the GPU.
    - name: Setup ROCm OpenCL
      run: |
        REPO=https://repo.radeon.com/rocm/apt/7.1/pool/main
        DIR=${RUNNER_TEMP}/rocm-opencl
        mkdir -p "${DIR}/debs" "${DIR}/vendors"
        while read -r SHA256 DEB; do
          FILE=${DIR}/debs/${DEB##*/}
          curl -fsSL --retry 5 --retry-all-errors -o "${FILE}" "${REPO}/${DEB}"
          echo "${SHA256}  ${FILE}" | sha256sum -c -
          dpkg-deb -x "${FILE}" "${DIR}"
        done <<EOF
        d5c465305933aa9c68ebbb1fcac19b708756cd345880468fe13dc8b915510f9b r/rocm-opencl/rocm-opencl_2.0.0.70100-20~24.04_amd64.deb
        c52aa27638f3a40edb9db3136912c574670848befd20d671a5c017832d6a1378 c/comgr/comgr_3.0.0.70100-20~24.04_amd64.deb
        f935d843dcf54db67072056e9fdfbd702464cfa6a36a0fccb4b5eaed3d70c4d2 r/rocm-device-libs/rocm-device-libs_1.0.0.70100-20~24.04_amd64.deb
        afbb518300fa51b21795c1d27828af13369699046b5b3034455d4c581c314fc4 r/rocm-core/rocm-core_7.1.0.70100-20~24.04_amd64.deb
        EOF
        ROCM=${DIR}/opt/rocm-7.1.0
        echo "${ROCM}/lib/libamdocl64.so" > "${DIR}/vendors/amdocl64.icd"
        # the simulator's libraries stay first: they are the HSA runtime
        { echo "OCL_ICD_VENDORS=${DIR}/vendors"
          echo "ROCM_PATH=${ROCM}"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}:${ROCM}/lib"
        } >> "${GITHUB_ENV}"

    - name: Devices
      run: |
        for GPU in ${GPUS}; do
          echo "::group::${GPU}"
          VGPU_GPU=${GPU} clinfo --raw | grep -E 'CL_PLATFORM_VERSION|CL_DEVICE_(NAME|VERSION|EXTENSIONS|.*ATOMIC.*)[[:space:]]'
          echo "::endgroup::"
        done

    - name: Setup LIBXS
      run: |
        git clone --depth 1 https://github.com/hfp/libxs.git ${{ github.workspace }}/../libxs
        echo "LIBXSROOT=${{ github.workspace }}/../libxs" >> $GITHUB_ENV

    - name: Build LIBXS
      run: cd ${LIBXSROOT} && make -j $(nproc)

    - name: Build LIBXSTREAM
      run: make -j $(nproc)

    - name: Test
      run: make -j $(nproc) test

    # Each FP-atomics variant of the SMM (fp64, fp32) and DBM (fp64) kernels on
    # every GPU: what the device reports, which expression was chosen (printed
    # by LIBXSTREAM_DEBUG), and whether the device result is right. The table
    # is written before the step fails, hence a failure still shows all of it.
    - name: Atomics
      shell: bash
      run: |
        STATUS=0
        TABLE=${RUNNER_TEMP}/atomics.md
        echo "| GPU | Device | cl_ext_float_atomics | Kernel | LIBXSTREAM_ATOMICS | ATOMIC_ADD_GLOBAL | Result |" > "${TABLE}"
        echo "|---|---|---|---|---|---|---|" >> "${TABLE}"
        for ELEM in float double; do
          make -j $(nproc) -C samples/smm ELEM_TYPE=${ELEM}
          cp samples/smm/acc_bench.x "${RUNNER_TEMP}/acc_bench_${ELEM}.x"
        done
        make -j $(nproc) -C samples/dbm
        for GPU in ${GPUS}; do
          INFO=$(VGPU_GPU=${GPU} clinfo --raw)
          DEVICE=$(echo "${INFO}" | sed -n 's/.*CL_DEVICE_NAME[[:space:]]*//p' | head -1)
          FPEXT=$(echo "${INFO}" | grep -q cl_ext_float_atomics && echo yes || echo no)
          for KERNEL in smm_double smm_float dbm; do
            case ${KERNEL} in
              smm_*) CMD="${RUNNER_TEMP}/acc_bench_${KERNEL#smm_}.x 1 1000 13x5x7" ;;
              *) CMD="samples/dbm/dbm_bench.x 1 1000 13x5x7" ;;
            esac
            for VARIANT in detected cmpxchg xchg; do
              LOG=${RUNNER_TEMP}/${GPU//\//_}-${KERNEL}-${VARIANT}.log
              if [ "detected" = "${VARIANT}" ]; then SET="-u LIBXSTREAM_ATOMICS"; else SET="LIBXSTREAM_ATOMICS=${VARIANT}"; fi
              RESULT=0
              env ${SET} VGPU_GPU=${GPU} LIBXSTREAM_DEBUG=1 LIBXSTREAM_VERBOSE=2 DBM_MULTIPLY_SMM=-1 \
                timeout 900 ${CMD} > "${LOG}" 2>&1 || RESULT=$?
              if [ "dbm" = "${KERNEL}" ] && [ "0" = "${RESULT}" ] && ! grep -q "DBM-kernel" "${LOG}"; then
                RESULT=host
              fi
              EXPR=$(grep -o 'ATOMIC_ADD_GLOBAL(A,B)=[^ "]*' "${LOG}" | sed 's/^ATOMIC_ADD_GLOBAL(A,B)=//' | sort -u | paste -sd' ')
              if [ "0" = "${RESULT}" ]; then OUTCOME=ok; else OUTCOME="FAILED (${RESULT})"; STATUS=1; fi
              echo "| ${GPU} | ${DEVICE} | ${FPEXT} | ${KERNEL} | ${VARIANT} | \`${EXPR:-none}\` | ${OUTCOME} |" >> "${TABLE}"
              if [ "ok" != "${OUTCOME}" ]; then
                echo "::group::${GPU} ${KERNEL} ${VARIANT}: ${OUTCOME}"
                grep -E 'ERROR|WARN|error:|FAILED|ATOMIC_ADD_GLOBAL' "${LOG}" | head -40
                echo "::endgroup::"
              fi
            done
          done
        done
        tee -a "${GITHUB_STEP_SUMMARY}" < "${TABLE}"
        exit ${STATUS}

    - name: Setup DBCSR
      run: |
        DBCSR_REPO="https://github.com/${OWNER_DBCSR}/dbcsr.git"
        git clone --depth 1 --recursive --shallow-submodules --branch "${REF_DBCSR}" \
          "${DBCSR_REPO}" ${{ github.workspace }}/../dbcsr
        echo "DBCSR_ROOT=${{ github.workspace }}/../dbcsr" >> $GITHUB_ENV
        git -C ${{ github.workspace }}/../dbcsr log -1 --format="DBCSR %H %cs"

    - name: Build DBCSR
      run: |
        cmake -S "${DBCSR_ROOT}" -B "${DBCSR_ROOT}/build" \
          -DUSE_ACCEL=opencl -DUSE_LIBXS=ON -DUSE_LIBXSMM=OFF -DUSE_MPI=OFF \
          -DBUILD_TESTING=ON -DCMAKE_PREFIX_PATH="${LIBXSROOT};${{ github.workspace }}"
        cmake --build "${DBCSR_ROOT}/build" -j $(nproc)

    - name: Test DBCSR backend
      run: |
        cd "${DBCSR_ROOT}/build/tests"
        ./dbcsr_acc_test
        ./acc_bench 1 1000 13x5x7
