name: AMD

permissions:
  contents: read
  # the previous run's counts (artifact)
  actions: read

# OpenCL on simulated AMD GPUs (https://github.com/pantheongpu/pantheonsim):
# ROCm's own OpenCL runtime, compiler included, runs on the simulator's HSA
# runtime, so every kernel is built for the card's real target and executed
# without a GPU. Correctness only: the simulator has no timing. Weekly, since
# neither the simulator nor ROCm moves with this repository. Every AMD profile
# runs by default, all treated alike: what a device can do is what it reports
# and what its compiler accepts. What the simulator cannot show is listed in
# the run's summary.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      gpus:
        description: "Simulated GPUs (vgpu list-gpus), every AMD one if empty"
        default: ""
      owner_dbcsr:
        description: "Owner of the DBCSR repository (hfp until upstreamed)"
        default: "hfp"
      ref_dbcsr:
        description: "DBCSR branch or tag"
        default: "develop"
      env:
        description: "Environment for all steps, e.g., LIBXSTREAM_VERBOSE=2"
        default: ""

jobs:
  # The simulator's build is cached when the job that built it succeeds. A job
  # of its own saves it before any test runs, hence a failing test does not
  # cost the next run a rebuild. Same runner image, hence the same cache key.
  Simulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Setup simulator
      uses: pantheongpu/setup-pantheonsim@ab71a07326835be678918901c340d53a83358067 # v0.1.6
      with:
        gpu: amd/mi250x
        rocm: none

  OpenCL:
    needs: Simulator
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      # the scheduled run has no inputs, hence the defaults of the inputs again
      GPUS: ${{ github.event.inputs.gpus }}
      OWNER_DBCSR: ${{ github.event.inputs.owner_dbcsr || 'hfp' }}
      REF_DBCSR: ${{ github.event.inputs.ref_dbcsr || 'develop' }}
      # a host fallback must not pass for a device run, nor a fallback after a failure
      LIBXSTREAM_DEVTYPE: gpu
      LIBXSTREAM_FALLBACK: 0
      OMP_NUM_THREADS: 2
      # acc_bench fails on a wrong result or a missing kernel only if CHECK is positive
      CHECK: 1
    steps:
    - uses: actions/checkout@v7

    # Space-separated NAME=VALUE pairs given when launching manually. They come
    # in through the environment rather than the script, so no value is executed.
    - name: Setup environment
      if: github.event.inputs.env != ''
      env:
        INPUT_ENV: ${{ github.event.inputs.env }}
      run: |
        for NAME_VALUE in ${INPUT_ENV}; do
          if ! echo "${NAME_VALUE}" | grep -qE '^[A-Za-z_][A-Za-z0-9_]*=[^[:space:]]*$'; then
            echo "ERROR: \"${NAME_VALUE}\" is not NAME=VALUE"; exit 1
          fi
          echo "${NAME_VALUE}" >> $GITHUB_ENV
          echo "${NAME_VALUE}"
        done

    # Two devices of the default GPU; a step selects another one by VGPU_GPU.
    # No hipcc (rocm: none): the OpenCL runtime below brings its own compiler.
    # The build comes from the cache the Simulator job saved.
    - name: Setup simulator
      uses: pantheongpu/setup-pantheonsim@ab71a07326835be678918901c340d53a83358067 # v0.1.6
      with:
        gpu: amd/mi250x
        count: 2
        rocm: none

    # The simulator's own list, hence a new profile joins without a change here.
    - name: Simulated GPUs
      run: |
        if [ -z "${GPUS}" ]; then GPUS=$(vgpu list-gpus | grep '^amd/' | paste -sd' ' -); fi
        if [ -z "${GPUS}" ]; then echo "ERROR: no simulated AMD GPU"; exit 1; fi
        echo "GPUS=${GPUS}" >> "${GITHUB_ENV}"
        echo "${GPUS}"

    - name: Install OpenBLAS, GNU Fortran, OpenCL, clinfo, and NumPy/SciPy
      run: |
        sudo apt update -y
        sudo apt install -y libopenblas-openmp-dev gfortran \
          opencl-c-headers ocl-icd-libopencl1 ocl-icd-opencl-dev clinfo \
          libelf1t64 libnuma1 libtinfo6 libzstd1 zlib1g python3-numpy python3-scipy

    # Unpacked rather than installed: the packages depend on the kernel driver
    # and on ROCm's HSA runtime, which is the simulator's here. The ICD loader
    # finds only this vendor, hence no CPU device can stand in for the GPU.
    # ROCm 7.2 is the first whose compiler knows gfx1250 (MI455X).
    - name: Setup ROCm OpenCL
      run: |
        REPO=https://repo.radeon.com/rocm/apt/7.2.4/pool/main
        DIR=${RUNNER_TEMP}/rocm-opencl
        mkdir -p "${DIR}/debs" "${DIR}/vendors"
        while read -r SHA256 DEB; do
          FILE=${DIR}/debs/${DEB##*/}
          curl -fsSL --retry 5 --retry-all-errors -o "${FILE}" "${REPO}/${DEB}"
          echo "${SHA256}  ${FILE}" | sha256sum -c -
          dpkg-deb -x "${FILE}" "${DIR}"
        done <<EOF
        4670f9770e82418a49087e55e0cc3066562e5b8ff763892fa8a672a099087909 r/rocm-opencl/rocm-opencl_2.0.0.70204-93~24.04_amd64.deb
        02951341120d23ebf34b066a84ab172e4813cba4a601f910545c6658989bee87 c/comgr/comgr_3.0.0.70204-93~24.04_amd64.deb
        78ed94b0732bfc3c0c6db7863eec777bb5d88c901d46c9f37ec925a2393dff89 r/rocm-device-libs/rocm-device-libs_1.0.0.70204-93~24.04_amd64.deb
        dfe0d173da998a669921faf08351a01add377cd4d1b471865f921a03484974b6 r/rocm-core/rocm-core_7.2.4.70204-93~24.04_amd64.deb
        EOF
        ROCM=${DIR}/opt/rocm-7.2.4
        echo "${ROCM}/lib/libamdocl64.so" > "${DIR}/vendors/amdocl64.icd"
        # the simulator's libraries stay first: they are the HSA runtime
        { echo "OCL_ICD_VENDORS=${DIR}/vendors"
          echo "ROCM_PATH=${ROCM}"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}:${ROCM}/lib"
        } >> "${GITHUB_ENV}"

    - name: Devices
      run: |
        for GPU in ${GPUS}; do
          echo "::group::${GPU}"
          VGPU_GPU=${GPU} clinfo --raw | grep -E 'CL_PLATFORM_VERSION|CL_DEVICE_(NAME|VERSION|EXTENSIONS|.*ATOMIC.*)[[:space:]]' \
            || echo "${GPU}: no OpenCL device"
          echo "::endgroup::"
        done

    - name: Setup LIBXS
      run: |
        git clone --depth 1 https://github.com/hfp/libxs.git ${{ github.workspace }}/../libxs
        echo "LIBXSROOT=${{ github.workspace }}/../libxs" >> $GITHUB_ENV

    - name: Build LIBXS
      run: cd ${LIBXSROOT} && make -j $(nproc)

    - name: Build LIBXSTREAM
      run: make -j $(nproc)

    - name: Test
      run: make -j $(nproc) test

    # The counts of the last passing run, to tell what this run changed. A
    # first run, or one whose predecessor's artifact expired, has none.
    - name: Previous counts
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        RUN=$(gh run list -R "${GITHUB_REPOSITORY}" --workflow amd.yml --branch "${GITHUB_REF_NAME}" \
          --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
        if [ -n "${RUN}" ] && gh run download "${RUN}" -R "${GITHUB_REPOSITORY}" -n atomics-logs -D "${RUNNER_TEMP}/previous"; then
          echo "PREV=${RUNNER_TEMP}/previous/counts.tsv" >> "${GITHUB_ENV}"
          echo "previous passing run: ${RUN}"
        fi

    # FP-atomics variants of the SMM and DBM kernels on every GPU, and a score
    # per kernel from what the simulator counted (tests/atomics.sh says what).
    # The summary is written before the step fails, hence a failure shows all.
    - name: Atomics
      shell: bash
      env:
        LOGS: ${{ runner.temp }}/atomics
        META: "ROCm 7.2.4, setup-pantheonsim ca87fe3"
      run: |
        STATUS=0
        tests/atomics.sh || STATUS=$?
        if [ -s "${LOGS}/summary.md" ]; then cat "${LOGS}/summary.md" >> "${GITHUB_STEP_SUMMARY}"; fi
        exit ${STATUS}

    # Every run's full output, also of the runs that passed (for comparison).
    - name: Upload atomics logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: atomics-logs
        path: ${{ runner.temp }}/atomics
        if-no-files-found: ignore

    - name: Setup DBCSR
      run: |
        DBCSR_REPO="https://github.com/${OWNER_DBCSR}/dbcsr.git"
        git clone --depth 1 --recursive --shallow-submodules --branch "${REF_DBCSR}" \
          "${DBCSR_REPO}" ${{ github.workspace }}/../dbcsr
        echo "DBCSR_ROOT=${{ github.workspace }}/../dbcsr" >> $GITHUB_ENV
        git -C ${{ github.workspace }}/../dbcsr log -1 --format="DBCSR %H %cs"

    - name: Build DBCSR
      run: |
        cmake -S "${DBCSR_ROOT}" -B "${DBCSR_ROOT}/build" \
          -DUSE_ACCEL=opencl -DUSE_LIBXS=ON -DUSE_LIBXSMM=OFF -DUSE_MPI=OFF \
          -DBUILD_TESTING=ON -DCMAKE_PREFIX_PATH="${LIBXSROOT};${{ github.workspace }}"
        cmake --build "${DBCSR_ROOT}/build" -j $(nproc)

    - name: Test DBCSR backend
      run: |
        cd "${DBCSR_ROOT}/build/tests"
        ./dbcsr_acc_test
        ./acc_bench 1 1000 13x5x7
