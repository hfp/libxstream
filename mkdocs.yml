site_name: LIBXSTREAM
site_author: Hans Pabst
copyright: Copyright (c) LIBXSTREAM Contributors
site_description: Library and accelerator backend.
repo_url: https://github.com/hfp/libxstream/
edit_uri: edit/main/documentation
site_url: https://libxstream.readthedocs.io/
docs_dir: documentation

markdown_extensions:
- toc:
    permalink: True
    toc_depth: 3
    title: None
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.details
- md_in_html
- admonition
- attr_list
extra_css:
- style.css

theme:
    name: readthedocs
    custom_dir: .theme

extra:
  collapsed_nav:
    - "Samples"
    - "Tests"
    - "More"

plugins:
  - search

hooks:
  - .theme/hook.py

nav:
- Overview: index.md
- Presentations: libxstream_present.md
- Domains:
  - "OpenCL": libxstream_opencl.md
  - "MPS": libxstream_mps.md
  - "DBCSR": libxstream_dbcsr.md
  - "CP2K": libxstream_cp2k.md
- Samples:
  - Stencil: samples/libxstream_stencil.md
  - Ozaki: samples/libxstream_ozaki.md
  - SMM: samples/libxstream_smm.md
  - DBM: samples/libxstream_dbm.md
- Tests:
  - Dump: tests/dump.md
  - Kernels: tests/kernels.md
  - Pin: tests/pin.md
  - Predict: tests/predict.md
  - PTX: tests/ptx.md
  - Shim: tests/shim.md
  - Shim Ozaki-2 FP32: tests/shim_ozaki2_fp32.md
  - Shim Ozaki-2 FP32f: tests/shim_ozaki2_fp32f.md
  - Shim Ozaki-2 FP64: tests/shim_ozaki2_fp64.md
  - Shim Ozaki-2 FP64f: tests/shim_ozaki2_fp64f.md
  - Shim Ozaki-2 Kgrp: tests/shim_ozaki2_kgrp.md
  - Shim Ozaki-2 Sym: tests/shim_ozaki2_sym.md
  - Shim SMM FP32: tests/shim_smm_fp32.md
  - Shim SMM FP64: tests/shim_smm_fp64.md
- More:
  - Contributing: libxstream_contrib.md
  - Development: libxstream_scripts.md
  - LIBXS: libxstream_libxs.md
